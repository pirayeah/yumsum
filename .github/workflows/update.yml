name: Update YumSum

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours
  workflow_dispatch: # the "Run workflow" button, and the idea workflow
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yumsum-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Read the board and write new recipes
        run: node scripts/sync.ts
        continue-on-error: true # if Pinterest or the AI is down, still publish what we have
        env:
          PINTEREST_USERNAME: ${{ vars.PINTEREST_USERNAME }}
          PINTEREST_BOARD: ${{ vars.PINTEREST_BOARD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}

      - name: Save new data to the repo
        run: |
          git config user.name "yumsum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update pins and recipes" && git pull --rebase && git push)

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_REPO: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
